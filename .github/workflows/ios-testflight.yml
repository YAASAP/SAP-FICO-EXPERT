name: iOS build et envoi TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _ios
    env:
      TEAM_ID: ZQ5V9WK977
      RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Nettoyer les identifiants (espaces, retours à la ligne)
        run: |
          echo "KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Écrire la clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          head -n 1 "$HOME/private_keys/AuthKey_${KEY_ID}.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "ERREUR : le secret ASC_KEY_P8 ne commence pas par -----BEGIN PRIVATE KEY-----"; exit 1; }
          echo "ID de clé : ${#KEY_ID} caractères (attendu : 10) ; ID émetteur : ${#ISSUER_ID} caractères (attendu : 36)"

      - name: Vérifier la clé auprès d'Apple
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, sys, time, urllib.request, urllib.error, jwt
          kid = os.environ["KEY_ID"]
          iss = os.environ["ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                       headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req)
              print("Clé API valide, statut", r.status)
          except urllib.error.HTTPError as e:
              print("Apple refuse la clé : HTTP", e.code)
              print("Vérifie ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 (même clé), et que la clé a le rôle Admin.")
              sys.exit(1)
          PY

      - name: Installer XcodeGen et générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (sans signature, la signature se fait à l'export)
        run: |
          xcodebuild archive \
            -project FicoExpert.xcodeproj \
            -scheme FicoExpert \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FicoExpert.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Exporter, signer et envoyer à App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FicoExpert.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
