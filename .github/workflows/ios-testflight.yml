name: iOS build et envoi TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: _ios
    env:
      TEAM_ID: ZQ5V9WK977
      RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Nettoyer les identifiants (espaces, retours à la ligne)
        run: |
          echo "KEY_ID=$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$(printf '%s' "$RAW_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Écrire la clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          OUT="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          CLEAN=$(printf '%s\n' "$ASC_KEY_P8" | tr -d '\r')
          # Garde uniquement le bloc entre BEGIN et END (ignore lignes vides et espaces autour)
          printf '%s\n' "$CLEAN" | sed -n '/-----BEGIN/,/-----END/p' > "$OUT"
          if [ ! -s "$OUT" ]; then
            # Essai : le secret contient peut-être le fichier encodé en base64
            printf '%s' "$CLEAN" | base64 --decode 2>/dev/null | sed -n '/-----BEGIN/,/-----END/p' > "$OUT" || true
          fi
          chmod 600 "$OUT"
          echo "Secret ASC_KEY_P8 : ${#ASC_KEY_P8} caractères, $(printf '%s\n' "$CLEAN" | wc -l | tr -d ' ') lignes (un fichier .p8 fait environ 250 caractères et 5 lignes)"
          echo "ID de clé : ${#KEY_ID} caractères (attendu : 10) ; ID émetteur : ${#ISSUER_ID} caractères (attendu : 36)"
          if [ ! -s "$OUT" ]; then
            echo "ERREUR : ASC_KEY_P8 ne contient pas de clé (-----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----)."
            echo "Ouvre le fichier .p8 avec le Bloc-notes, copie tout son contenu et recolle-le dans le secret."
            exit 1
          fi

      - name: Vérifier la clé auprès d'Apple
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, sys, time, urllib.request, urllib.error, jwt
          kid = os.environ["KEY_ID"]
          iss = os.environ["ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1",
                                       headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req)
              print("Clé API valide, statut", r.status)
          except urllib.error.HTTPError as e:
              print("Apple refuse la clé : HTTP", e.code)
              print("Vérifie ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 (même clé), et que la clé a le rôle Admin.")
              sys.exit(1)
          PY

      - name: Injecter les codes Premium (secrets, jamais commités)
        env:
          FICO_PREMIUM_CODES: ${{ secrets.FICO_PREMIUM_CODES }}
          FICO_ATLAS_ENTRIES: ${{ secrets.FICO_ATLAS_ENTRIES }}
        run: |
          python3 - <<'PY'
          import json, os
          codes = "".join((os.environ.get("FICO_PREMIUM_CODES") or "").split())
          atlas = []
          for line in (os.environ.get("FICO_ATLAS_ENTRIES") or "").splitlines():
              line = line.strip()
              if ":" in line:
                  email, code = line.split(":", 1)
                  atlas.append((email.strip(), code.strip()))
          entries = ", ".join("(email: %s, code: %s)" % (json.dumps(e), json.dumps(c)) for e, c in atlas)
          src = "enum PremiumSecrets {\n"
          src += "    static let ficheCodes = %s\n" % json.dumps(codes)
          src += "    static let atlasEntries: [(email: String, code: String)] = [%s]\n" % entries
          src += "    static var isConfigured: Bool { !ficheCodes.isEmpty || !atlasEntries.isEmpty }\n}\n"
          open("FicoExpert/PremiumSecrets.swift", "w").write(src)
          print("Codes fiches :", len(codes) // 26, "| entrées Atlas :", len(atlas))
          if not codes and not atlas:
              print("ATTENTION : aucun code Premium fourni, l'achat n'ouvrira aucune fiche.")
          PY

      - name: Installer XcodeGen et générer le projet
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (sans signature, la signature se fait à l'export)
        run: |
          xcodebuild archive \
            -project FicoExpert.xcodeproj \
            -scheme FicoExpert \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FicoExpert.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Exporter, signer et envoyer à App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FicoExpert.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
