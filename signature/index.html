<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Signature iPhone – YAASAP</title>
<style>body{font-family:-apple-system,Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px;color:#0f2044}
button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:17px;width:100%;margin:16px 0}
.sig{border:1px dashed #aab;padding:12px;border-radius:8px;background:#fff}ol{line-height:1.6;padding-left:20px}#ok{color:#0a7d33;font-weight:600}</style></head><body>
<h2>Signature automatique iPhone</h2>
<div class="sig" id="sig"><a href="mailto:yacine.aouabed@yaasap.com"><img src="https://yaasap.github.io/SAP-FICO-EXPERT/signature/logo_sap_fico_expert.gif" width="320" alt="Yacine AOUABED – YAASAP – 06 67 47 90 28 – yacine.aouabed@yaasap.com" style="border:0;display:block"></a></div>
<button onclick="cp()">Copier la signature</button><p id="ok"></p>
<ol><li>Touche <b>Copier la signature</b> (ou appui long sur la signature → Copier).</li>
<li>Ouvre <b>Réglages → Apps → Mail → Signature</b> (iOS 17 : Réglages → Mail).</li>
<li>Efface le texte, appui long → <b>Coller</b>.</li></ol>
<script>
async function cp(){var h=document.getElementById('sig').innerHTML,ok=document.getElementById('ok');
try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob(['Yacine AOUABED – YAASAP'],{type:'text/plain'})})]);ok.textContent='Copié ✔ – colle-la dans Signature.';}
catch(e){var r=document.createRange();r.selectNode(document.getElementById('sig'));var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');ok.textContent='Copié ✔ – colle-la dans Signature.';}}
</script></body></html>
