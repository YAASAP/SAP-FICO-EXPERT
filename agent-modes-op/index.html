/* ===== Utilitaires ===== */
var $=function(s){return document.querySelector(s)};
var stop="de la le les un une des du et ou en pour dans sur avec comment faire je je veux comme quoi est que qui au aux d l à a mon ma mes ce cette quel quelle quelles quels lancer créer saisir faut".split(" ");
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9._\- ]/g," ")}
function toks(s){return norm(s).split(/\s+/).filter(function(w){return w&&stop.indexOf(w)<0&&w.length>1})}
function bukrs(){return ($("#bukrs").value||"1000").toUpperCase().trim()||"1000"}
function sub(t){return t.replace(/\{BUKRS\}/g,bukrs())}
function strip(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent}
function score(e,q){
  var qt=toks(q),sc=0,ql=norm(q);
  if(!qt.length)return 0;
  var tcs=e.tc.map(norm),mots=norm(e.mots+" "+e.mod),titre=norm(e.titre),body=norm(strip(e.et.join(" ")+" "+e.obj));
  qt.forEach(function(w){
    if(tcs.indexOf(w)>=0)sc+=12;
    if(mots.split(" ").some(function(m){return m===w}))sc+=4;
    else if(w.length>3&&mots.indexOf(w)>=0)sc+=2;
    if(titre.indexOf(w)>=0)sc+=3;
    if(w.length>3&&body.indexOf(w)>=0)sc+=1;
  });
  if(mots.indexOf(ql.trim())>=0&&ql.trim().length>3)sc+=5;
  return sc;
}
function find(q){
  return KB.map(function(e){return {e:e,s:score(e,q)}}).filter(function(x){return x.s>0}).sort(function(a,b){return b.s-a.s});
}

  L.push("","Source : YAASAP · Agent Modes Opératoires SAP FICO");return L.join("\n");

var last=null;
function ask(q){
  q=q.trim();if(!q)return;lastQ=q;
  add("me",q.replace(/</g,"&lt;"));
  var ql=norm(q);
  if(last&&/erreur|probleme|bloque|marche pas|echec/.test(ql)&&toks(q).length<=3){
    add("bot","Erreurs fréquentes — <b>"+last.titre+"</b> :<ul style='margin:6px 0 0;padding-left:18px'>"+last.err.map(function(x){return "<li>"+sub(x)+"</li>"}).join("")+"</ul>");return;
  }
  if(last&&/controle|verifier|valider le resultat/.test(ql)&&toks(q).length<=3){
    add("bot","Contrôles — <b>"+last.titre+"</b> :<ul style='margin:6px 0 0;padding-left:18px'>"+last.ctl.map(function(x){return "<li>"+sub(x)+"</li>"}).join("")+"</ul>");return;
  }
  var r=find(q);
  if(!r.length){
    if(API_URL){askAI(q,true);return}
    add("bot","Je n'ai pas de mode opératoire pour cette demande. Essayez une transaction (<code>F110</code>, <code>FB50</code>…) ou un mot-clé (« lettrage », « immobilisation »).");
    chips(["Écriture comptable","Paiement fournisseur","Lettrage","Clôture annuelle"]);return;
  }
  var top=r[0].e;last=top;
  add("bot","Voici le mode opératoire : <b>"+top.titre+"</b>.");addDoc(top);
  if(r.length>1){add("bot","Autres procédures proches :");chips(r.slice(1,4).map(function(x){return x.e.titre}),r.slice(1,4).map(function(x){return x.e.id}))}
  else chips(["Erreurs fréquentes","Contrôles"]);
  if(API_URL){var d=document.createElement("div");d.className="chips";var b=document.createElement("button");b.className="chip";b.type="button";b.textContent="✨ Version rédigée par l'IA";b.onclick=function(){askAI(q)};d.appendChild(b);$("#chat").appendChild(d)}
}
function chips(labels,ids){
  var d=document.createElement("div");d.className="chips";
  labels.forEach(function(l,i){var b=document.createElement("button");b.className="chip";b.type="button";b.textContent=l;b.onclick=function(){ids&&ids[i]?openId(ids[i]):ask(l)};d.appendChild(b)});
  $("#chat").appendChild(d);
}

/* ===== Agent IA (serveur YAASAP) ===== */
var API_URL="https://utilized-messy-pipelining.replit.app";/* renseigné après publication du serveur */
var lastQ="";
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(t){
  var out=[],inOl=false,inUl=false;
  esc(t).split("\n").forEach(function(l){
    l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
    var m=l.match(/^\s*(\d+)[.)]\s+(.*)/),u=l.match(/^\s*[-•]\s+(.*)/),h=l.match(/^#+\s*(.*)/);
    if(m){if(inUl){out.push("</ul>");inUl=false}if(!inOl){out.push("<ol>");inOl=true}out.push("<li>"+m[2]+"</li>");return}
    if(u){if(inOl){out.push("</ol>");inOl=false}if(!inUl){out.push("<ul>");inUl=true}out.push("<li>"+u[1]+"</li>");return}
    if(inOl){out.push("</ol>");inOl=false}if(inUl){out.push("</ul>");inUl=false}
    if(h)out.push("<h3>"+h[1]+"</h3>");else if(l.trim())out.push("<p style='margin:6px 0'>"+l+"</p>");
  });
  if(inOl)out.push("</ol>");if(inUl)out.push("</ul>");
  return out.join("");
}
function askAI(q,silent){
  if(!API_URL){if(!silent)add("bot","L'agent IA n'est pas encore connecté. Utilisez la bibliothèque de fiches.");return}
  var w=add("bot","Rédaction du mode opératoire par l'IA…");
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},60000);
  fetch(API_URL+"/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q.slice(0,400),codeSociete:bukrs()}),signal:ctl.signal})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(x){
    clearTimeout(to);w.remove();
    if(!x.ok||!x.j||!x.j.reponse){add("bot",esc((x.j&&x.j.error)||x.j&&x.j.message||"L'agent IA est indisponible pour le moment. Réessayez plus tard ou utilisez la bibliothèque de fiches."));return}
    var d=document.createElement("div");d.className="msg bot keep";d.style.display="block";
    d.innerHTML='<div class="doc"><div class="tags"><span class="tag m">Généré par IA</span></div>'+md(x.j.reponse)+'<p class="foot" style="text-align:left">Réponse générée automatiquement : à vérifier et à adapter au paramétrage de votre système.</p><div class="act"><button class="btn p" data-copyai="1">Copier</button></div></div>';
    d._txt=x.j.reponse;$("#chat").appendChild(d);d.scrollIntoView({block:"start",behavior:"smooth"});
  })
  .catch(function(){clearTimeout(to);w.remove();add("bot","Pas de connexion à l'agent IA. Les fiches de la bibliothèque restent disponibles hors ligne.")});
}
